name: Central Multiplatform Mobile App Builder

on:
  workflow_call:
    inputs:
      app_name:
        description: 'App repository name (e.g. client-app)'
        required: true
        type: string
      target_platform:
        description: 'Build target: android, ios, or both'
        required: false
        type: string
        default: 'both'
      flutter_version:
        description: 'Flutter runtime version'
        required: false
        type: string
        default: '3.41.9'
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEY_PROPERTIES:
        required: false
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: false
      APPLE_APP_STORE_KEY_P8:
        required: false
      APPLE_KEY_ID:
        required: false
      APPLE_ISSUER_ID:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application to build & deploy'
        required: true
        type: choice
        options:
          - client-app
          - restaurant-app
          - delivery-app
        default: client-app
      target_platform:
        description: 'Target Store Platform'
        required: true
        type: choice
        options:
          - both
          - android
          - ios
        default: both

jobs:
  notify-start:
    name: Notify Telegram Start
    runs-on: ubuntu-latest
    steps:
      - name: Send Alert
        if: secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != ''
        run: |
          APP="${{ inputs.app_name }}"
          PLATFORM="${{ inputs.target_platform }}"
          REF="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          
          TEXT="🚀 *[${APP}] Store Build Pipeline Triggered*%0A%0A"
          TEXT+="• *App:* \`twseel-station/${APP}\`%0A"
          TEXT+="• *Target:* \`${PLATFORM}\`%0A"
          TEXT+="• *Ref:* \`${REF}\` by *${ACTOR}*%0A"
          TEXT+="• *Runner:* GitHub Hosted Free Fleet%0A"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${TEXT}" \
            -d "parse_mode=Markdown" > /dev/null || true

  build-android:
    name: Build & Release Android Bundle (.aab)
    if: inputs.target_platform == 'android' || inputs.target_platform == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '3.41.9' }}
          channel: 'stable'
          cache: true

      - name: Restore Keystore & Secrets
        if: secrets.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          if [ -n "${{ secrets.ANDROID_KEY_PROPERTIES }}" ]; then
            printf "%s\n" "${{ secrets.ANDROID_KEY_PROPERTIES }}" > android/key.properties
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload to Google Play (Internal / Production)
        if: secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != ''
        run: |
          echo "Preparing Google Play distribution..."
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" > play-service-account.json
          echo "AAB build completed successfully at build/app/outputs/bundle/release/app-release.aab"

  build-ios:
    name: Build & Release iOS Package (.ipa)
    if: inputs.target_platform == 'ios' || inputs.target_platform == 'both'
    runs-on: macos-14
    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '3.41.9' }}
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS IPA
        run: flutter build ipa --release --no-codesign

      - name: Prepare Apple Auth Key
        if: secrets.APPLE_APP_STORE_KEY_P8 != ''
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPLE_APP_STORE_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_KEY_ID }}.p8

  notify-finish:
    name: Notify Telegram Finish
    needs: [build-android, build-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Completion Alert
        if: secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != ''
        run: |
          APP="${{ inputs.app_name }}"
          PLATFORM="${{ inputs.target_platform }}"
          
          ANDROID_STATUS="${{ needs.build-android.result }}"
          IOS_STATUS="${{ needs.build-ios.result }}"
          
          TEXT="🏁 *[${APP}] Store Pipeline Finished*%0A%0A"
          TEXT+="• *Android Build:* ${ANDROID_STATUS}%0A"
          TEXT+="• *iOS Build:* ${IOS_STATUS}%0A"
          TEXT+="• *Target:* \`${PLATFORM}\`%0A"
          TEXT+="• *Run Details:* [View Actions Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${TEXT}" \
            -d "parse_mode=Markdown" > /dev/null || true
