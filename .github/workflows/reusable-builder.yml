name: Central Multiplatform Mobile App Builder

on:
  workflow_call:
    inputs:
      app_name:
        description: 'App repository name (e.g. client-app)'
        required: true
        type: string
      target_platform:
        description: 'Build target: android, ios, or both'
        required: false
        type: string
        default: 'both'
      flutter_version:
        description: 'Flutter runtime version'
        required: false
        type: string
        default: '3.41.9'
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEY_PROPERTIES:
        required: false
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: false
      APPLE_APP_STORE_KEY_P8:
        required: false
      APPLE_KEY_ID:
        required: false
      APPLE_ISSUER_ID:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application to build & deploy'
        required: true
        type: choice
        options:
          - client-app
          - restaurant-app
          - delivery-app
        default: client-app
      target_platform:
        description: 'Target Store Platform'
        required: true
        type: choice
        options:
          - both
          - android
          - ios
        default: both

jobs:
  notify-start:
    name: Notify Telegram Start
    runs-on: ubuntu-latest
    steps:
      - name: Send Alert
        env:
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT" ] && [ -n "$TG_CHAT" ]; then
            APP="${{ inputs.app_name }}"
            PLATFORM="${{ inputs.target_platform }}"
            REF="${{ github.ref_name }}"
            ACTOR="${{ github.actor }}"
            
            TEXT="🚀 *[${APP}] Store Build Pipeline Triggered*%0A%0A"
            TEXT+="• *App:* \`twseel-station/${APP}\`%0A"
            TEXT+="• *Target:* \`${PLATFORM}\`%0A"
            TEXT+="• *Ref:* \`${REF}\` by *${ACTOR}*%0A"
            TEXT+="• *Runner:* GitHub Hosted Free Fleet%0A"
            
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d "chat_id=${TG_CHAT}" \
              -d "text=${TEXT}" \
              -d "parse_mode=Markdown" > /dev/null || true
          fi

  build-android:
    name: Build & Release Android Bundle (.aab)
    if: inputs.target_platform == 'android' || inputs.target_platform == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '3.41.9' }}
          channel: 'stable'
          cache: true

      - name: Restore Keystore & Secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP_VAL: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
          fi
          if [ -n "$KP_VAL" ]; then
            printf "%s\n" "$KP_VAL" > android/key.properties
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Publisher API Tools
        run: pip install google-api-python-client oauth2client

      - name: Download & Run Play Publisher Script
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "$PLAY_JSON" > /tmp/play-service-account.json
            curl -s https://raw.githubusercontent.com/twseel-station/apps-builder/main/scripts/upload_to_play.py -o /tmp/upload_to_play.py
            PLAY_JSON_PATH=/tmp/play-service-account.json python /tmp/upload_to_play.py
          fi

  build-ios:
    name: Build & Release iOS Package (.ipa)
    if: inputs.target_platform == 'ios' || inputs.target_platform == 'both'
    runs-on: macos-latest
    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '3.41.9' }}
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS IPA
        run: flutter build ipa --release --no-codesign

      - name: Prepare Apple Auth Key
        env:
          P8_VAL: ${{ secrets.APPLE_APP_STORE_KEY_P8 }}
          K_ID: ${{ secrets.APPLE_KEY_ID }}
        run: |
          if [ -n "$P8_VAL" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$P8_VAL" > ~/.appstoreconnect/private_keys/AuthKey_${K_ID}.p8
          fi

  notify-finish:
    name: Notify Telegram Finish
    needs: [build-android, build-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Completion Alert
        env:
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT" ] && [ -n "$TG_CHAT" ]; then
            APP="${{ inputs.app_name }}"
            PLATFORM="${{ inputs.target_platform }}"
            
            ANDROID_STATUS="${{ needs.build-android.result }}"
            IOS_STATUS="${{ needs.build-ios.result }}"
            
            TEXT="🏁 *[${APP}] Store Pipeline Finished*%0A%0A"
            TEXT+="• *Android Build:* ${ANDROID_STATUS}%0A"
            TEXT+="• *iOS Build:* ${IOS_STATUS}%0A"
            TEXT+="• *Target:* \`${PLATFORM}\`%0A"
            TEXT+="• *Run Details:* [View Actions Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d "chat_id=${TG_CHAT}" \
              -d "text=${TEXT}" \
              -d "parse_mode=Markdown" > /dev/null || true
          fi
