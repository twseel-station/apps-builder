name: Central Store Builder & Publisher (100% Free Public Runner)
run-name: "Build & Release [${{ inputs.app_name }}] (${{ inputs.target_platform }}) - Track: ${{ inputs.target_env }} (${{ inputs.ref_branch }})"

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Select Application to Build'
        required: true
        type: choice
        options:
          - client-app
          - restaurant-app
          - delivery-app
        default: client-app
      target_platform:
        description: 'Target Store Platform'
        required: true
        type: choice
        options:
          - both
          - android
          - ios
        default: both
      target_env:
        description: 'Target Track Environment'
        required: true
        type: choice
        options:
          - test
          - production
        default: test
      ref_branch:
        description: 'Branch or Ref to build'
        required: false
        type: string
        default: 'develop'
      flutter_version:
        description: 'Flutter Runtime Version'
        required: false
        type: string
        default: '3.41.9'

jobs:
  notify-start:
    name: Notify Telegram Start
    runs-on: ubuntu-latest
    steps:
      - name: Send Alert
        env:
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT" ] && [ -n "$TG_CHAT" ]; then
            APP="${{ inputs.app_name }}"
            PLATFORM="${{ inputs.target_platform }}"
            ENV="${{ inputs.target_env }}"
            REF="${{ inputs.ref_branch }}"
            ACTOR="${{ github.actor }}"
            
            TEXT="🌐 *[${APP}] 100% Free Public Store Runner Started*%0A%0A"
            TEXT+="• *App:* \`twseel-station/${APP}\`%0A"
            TEXT+="• *Platform:* \`${PLATFORM}\`%0A"
            TEXT+="• *Target Track:* *${ENV}* (Branch: \`${REF}\`)%0A"
            TEXT+="• *Trigger:* by *${ACTOR}*%0A"
            TEXT+="• *Quota Cost:* 0.00$ (Unlimited Free)%0A"
            
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d "chat_id=${TG_CHAT}" \
              -d "text=${TEXT}" \
              -d "parse_mode=Markdown" > /dev/null || true
          fi

  build-android:
    name: Build & Release Android Bundle (.aab)
    if: inputs.target_platform == 'android' || inputs.target_platform == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Builder Scripts (apps-builder)
        uses: actions/checkout@v4
        with:
          path: builder-tools

      - name: Checkout Application Code (From Private Repo via Token)
        uses: actions/checkout@v4
        with:
          repository: twseel-station/${{ inputs.app_name }}
          token: ${{ secrets.GH_PAT }}
          ref: ${{ inputs.ref_branch || 'develop' }}
          path: app-source

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '3.41.9' }}
          channel: 'stable'
          cache: true

      - name: Restore Keystore & Secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP_VAL: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          cd app-source
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
          fi
          if [ -n "$KP_VAL" ]; then
            printf "%s\n" "$KP_VAL" > android/key.properties
          fi

      - name: Install Dependencies
        run: |
          cd app-source
          flutter pub get

      - name: Build Android App Bundle (AAB)
        env:
          TARGET_ENV: ${{ inputs.target_env }}
          API_URL_TEST: ${{ secrets.API_BASE_URL_TEST }}
          API_URL_PROD: ${{ secrets.API_BASE_URL_PROD }}
          API_DOM_TEST: ${{ secrets.API_DOMAIN_TEST }}
          API_DOM_PROD: ${{ secrets.API_DOMAIN_PROD }}
          RECEIPT_URL_TEST: ${{ secrets.RECEIPT_BASE_URL_TEST }}
          RECEIPT_URL_PROD: ${{ secrets.RECEIPT_BASE_URL_PROD }}
          MOYASAR_TEST: ${{ secrets.MOYASAR_KEY_TEST }}
          MOYASAR_PROD: ${{ secrets.MOYASAR_KEY_PROD }}
          PAYTABS_PID_TEST: ${{ secrets.PAYTABS_PROFILE_ID_TEST }}
          PAYTABS_PID_PROD: ${{ secrets.PAYTABS_PROFILE_ID_PROD }}
          PAYTABS_CKEY_TEST: ${{ secrets.PAYTABS_CLIENT_KEY_TEST }}
          PAYTABS_CKEY_PROD: ${{ secrets.PAYTABS_CLIENT_KEY_PROD }}
          PAYTABS_SKEY_TEST: ${{ secrets.PAYTABS_SERVER_KEY_TEST }}
          PAYTABS_SKEY_PROD: ${{ secrets.PAYTABS_SERVER_KEY_PROD }}
        run: |
          cd app-source
          if [ "$TARGET_ENV" = "test" ]; then
            echo "🔧 Compiling for TEST environment using GitHub Secrets..."
            DART_DEFINES="--dart-define=APP_ENV=test --dart-define=API_BASE_URL=$API_URL_TEST --dart-define=API_DOMAIN=$API_DOM_TEST --dart-define=RECEIPT_BASE_URL=$RECEIPT_URL_TEST --dart-define=MOYASAR_KEY=$MOYASAR_TEST --dart-define=PAYTABS_PROFILE_ID=$PAYTABS_PID_TEST --dart-define=PAYTABS_CLIENT_KEY=$PAYTABS_CKEY_TEST --dart-define=PAYTABS_SERVER_KEY=$PAYTABS_SKEY_TEST"
          else
            echo "🚀 Compiling for PRODUCTION environment using GitHub Secrets..."
            DART_DEFINES="--dart-define=APP_ENV=production --dart-define=API_BASE_URL=$API_URL_PROD --dart-define=API_DOMAIN=$API_DOM_PROD --dart-define=RECEIPT_BASE_URL=$RECEIPT_URL_PROD --dart-define=MOYASAR_KEY=$MOYASAR_PROD --dart-define=PAYTABS_PROFILE_ID=$PAYTABS_PID_PROD --dart-define=PAYTABS_CLIENT_KEY=$PAYTABS_CKEY_PROD --dart-define=PAYTABS_SERVER_KEY=$PAYTABS_SKEY_PROD"
          fi
          flutter build appbundle --release $DART_DEFINES

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Publisher API Tools
        run: pip install google-api-python-client oauth2client

      - name: Upload to Google Play Track
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          TARGET_ENV: ${{ inputs.target_env }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "$PLAY_JSON" > /tmp/play-service-account.json
            BUNDLE_PATH="app-source/build/app/outputs/bundle/release/app-release.aab"
            
            TRACK="internal"
            if [ "$TARGET_ENV" = "production" ]; then
              TRACK="production"
            fi
            
            echo "Deploying to Google Play track: $TRACK..."
            PLAY_JSON_PATH=/tmp/play-service-account.json BUNDLE_PATH="$BUNDLE_PATH" TRACK_NAME="$TRACK" python builder-tools/scripts/upload_to_play.py
          fi

  build-ios:
    name: Build & Release iOS Package (.ipa)
    if: inputs.target_platform == 'ios' || inputs.target_platform == 'both'
    runs-on: macos-latest
    steps:
      - name: Checkout Builder Scripts (apps-builder)
        uses: actions/checkout@v4
        with:
          path: builder-tools

      - name: Checkout Application Code (From Private Repo via Token)
        uses: actions/checkout@v4
        with:
          repository: twseel-station/${{ inputs.app_name }}
          token: ${{ secrets.GH_PAT }}
          ref: ${{ inputs.ref_branch || 'develop' }}
          path: app-source

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '3.41.9' }}
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd app-source
          flutter pub get

      - name: Build iOS IPA
        env:
          TARGET_ENV: ${{ inputs.target_env }}
          API_URL_TEST: ${{ secrets.API_BASE_URL_TEST }}
          API_URL_PROD: ${{ secrets.API_BASE_URL_PROD }}
          API_DOM_TEST: ${{ secrets.API_DOMAIN_TEST }}
          API_DOM_PROD: ${{ secrets.API_DOMAIN_PROD }}
          RECEIPT_URL_TEST: ${{ secrets.RECEIPT_BASE_URL_TEST }}
          RECEIPT_URL_PROD: ${{ secrets.RECEIPT_BASE_URL_PROD }}
          MOYASAR_TEST: ${{ secrets.MOYASAR_KEY_TEST }}
          MOYASAR_PROD: ${{ secrets.MOYASAR_KEY_PROD }}
          PAYTABS_PID_TEST: ${{ secrets.PAYTABS_PROFILE_ID_TEST }}
          PAYTABS_PID_PROD: ${{ secrets.PAYTABS_PROFILE_ID_PROD }}
          PAYTABS_CKEY_TEST: ${{ secrets.PAYTABS_CLIENT_KEY_TEST }}
          PAYTABS_CKEY_PROD: ${{ secrets.PAYTABS_CLIENT_KEY_PROD }}
          PAYTABS_SKEY_TEST: ${{ secrets.PAYTABS_SERVER_KEY_TEST }}
          PAYTABS_SKEY_PROD: ${{ secrets.PAYTABS_SERVER_KEY_PROD }}
        run: |
          cd app-source
          if [ "$TARGET_ENV" = "test" ]; then
            echo "🔧 Compiling for TEST environment using GitHub Secrets..."
            DART_DEFINES="--dart-define=APP_ENV=test --dart-define=API_BASE_URL=$API_URL_TEST --dart-define=API_DOMAIN=$API_DOM_TEST --dart-define=RECEIPT_BASE_URL=$RECEIPT_URL_TEST --dart-define=MOYASAR_KEY=$MOYASAR_TEST --dart-define=PAYTABS_PROFILE_ID=$PAYTABS_PID_TEST --dart-define=PAYTABS_CLIENT_KEY=$PAYTABS_CKEY_TEST --dart-define=PAYTABS_SERVER_KEY=$PAYTABS_SKEY_TEST"
          else
            echo "🚀 Compiling for PRODUCTION environment using GitHub Secrets..."
            DART_DEFINES="--dart-define=APP_ENV=production --dart-define=API_BASE_URL=$API_URL_PROD --dart-define=API_DOMAIN=$API_DOM_PROD --dart-define=RECEIPT_BASE_URL=$RECEIPT_URL_PROD --dart-define=MOYASAR_KEY=$MOYASAR_PROD --dart-define=PAYTABS_PROFILE_ID=$PAYTABS_PID_PROD --dart-define=PAYTABS_CLIENT_KEY=$PAYTABS_CKEY_PROD --dart-define=PAYTABS_SERVER_KEY=$PAYTABS_SKEY_PROD"
          fi
          flutter build ipa --release --no-codesign $DART_DEFINES

      - name: Upload to Apple App Store / TestFlight
        env:
          APPLE_APP_STORE_KEY_P8: ${{ secrets.APPLE_APP_STORE_KEY_P8 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          TARGET_ENV: ${{ inputs.target_env }}
        run: |
          if [ -n "$APPLE_APP_STORE_KEY_P8" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$APPLE_APP_STORE_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_KEY_ID}.p8
            python3 builder-tools/scripts/upload_to_testflight.py
          fi

  notify-finish:
    name: Notify Telegram Finish
    needs: [build-android, build-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Completion Alert
        env:
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT" ] && [ -n "$TG_CHAT" ]; then
            APP="${{ inputs.app_name }}"
            PLATFORM="${{ inputs.target_platform }}"
            ENV="${{ inputs.target_env }}"
            
            ANDROID_STATUS="${{ needs.build-android.result }}"
            IOS_STATUS="${{ needs.build-ios.result }}"
            
            TEXT="🏁 *[${APP}] Free Public Store Pipeline Finished*%0A%0A"
            TEXT+="• *Track / Target:* *${ENV}*%0A"
            TEXT+="• *Android Build:* ${ANDROID_STATUS}%0A"
            TEXT+="• *iOS Build:* ${IOS_STATUS}%0A"
            TEXT+="• *Cost:* 0.00$ (Free)%0A"
            TEXT+="• *Run Details:* [View Actions Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d "chat_id=${TG_CHAT}" \
              -d "text=${TEXT}" \
              -d "parse_mode=Markdown" > /dev/null || true
          fi
